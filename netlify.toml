[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# Route backend API and OAuth endpoints to Netlify Functions
[[redirects]]
  from = "/api/assistant/chat"
  to = "/.netlify/functions/assistant-chat"
  status = 200

[[redirects]]
  from = "/api/github/repos"
  to = "/.netlify/functions/github-repos"
  status = 200

[[redirects]]
  from = "/api/auth/github/url"
  to = "/.netlify/functions/auth-github-url"
  status = 200

[[redirects]]
  from = "/api/auth/github/user"
  to = "/.netlify/functions/auth-github-user"
  status = 200

[[redirects]]
  from = "/auth/callback"
  to = "/.netlify/functions/auth-callback"
  status = 200

[[redirects]]
  from = "/auth/callback/"
  to = "/.netlify/functions/auth-callback"
  status = 200

# SPA fallback for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long-lived cache for Vite hashed assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
